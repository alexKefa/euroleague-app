<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clutch QR Card</title>
  <meta name="description" content="Print-ready QR flyer for Clutch, in Greek — logo, a four-feature showcase grid, a scannable code, and a feature summary." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f1efea;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0a0b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0a0a0b;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
    }
    body {
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 3.5rem 1.5rem;
    }

    /* The card is the print artifact itself — a fixed dark object, not page
       chrome, so it keeps one identity regardless of the viewer's theme
       (same reasoning a printed sticker or table-tent would: it doesn't
       repaint itself when someone's phone is in light mode). Height is left
       intrinsic (no forced aspect-ratio) since the four-panel showcase grid
       below needs real room — a locked ratio would either clip the grid or
       force it to be squeezed, both worse than a card that's simply a bit
       taller than the old QR-only version. */
    .card {
      --ink: #f0f0ec;
      --muted: #8a8a86;
      --accent: #ff6b35;
      --line: #232324;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #151516;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.9rem 1.5rem 1.5rem;
      color: var(--ink);
      font-family: "Barlow", sans-serif;
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.3));
    }

    .brand {
      display: inline-flex;
      align-items: center;
    }
    .brand svg {
      display: block;
    }
    .subtitle {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0.4rem 0 0;
      text-align: center;
    }

    /* Four-feature showcase grid (2026-09-13) — replaces the old bare QR
       with a preview of what scanning actually leads to, same reasoning
       the landing page's own carousel demonstrates the app rather than
       just describing it. Icons are this app's real nav-icon glyphs
       (shared/nav-icon.ts), not illustrated mockups — keeps the flyer
       visually consistent with the live product instead of introducing a
       one-off illustration style that could drift from it. */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      width: 100%;
      margin: 1rem 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.7rem 0.4rem;
    }
    .panel svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .panel-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.48rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.25;
    }

    .qr-panel {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0.9rem 0.9rem 0.8rem;
      order: 3;
    }
    .qr-box {
      width: 58%;
      max-width: 190px;
      aspect-ratio: 1 / 1;
      line-height: 0;
    }
    .qr-box canvas,
    .qr-box svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .scan {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      text-align: center;
      line-height: 1.5;
    }
    .scan span {
      color: var(--accent);
    }

    .features {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.56rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--line);
      padding-top: 0.85rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand"><svg width="102" height="34" viewBox="0 0 600 200" role="img" aria-label="Clutch"><g transform="translate(8 140) scale(0.15117 -0.15117)"><path transform="translate(0 0)" d="M733 405H522Q522 465 490.5 500.0Q459 535 401 535Q334 535 302.5 493.0Q271 451 271 376V312Q271 238 302.5 195.5Q334 153 399 153Q463 153 496.0 186.0Q529 219 529 279H733Q733 138 646.5 63.0Q560 -12 402 -12Q226 -12 135.5 78.0Q45 168 45 344Q45 520 135.5 610.0Q226 700 402 700Q555 700 644.0 623.5Q733 547 733 405Z" fill="var(--ink)"/><path transform="translate(768 0)" d="M67 0V725H266V0Z" fill="var(--ink)"/><path transform="translate(1091 0)" d="M443 0 430 80Q399 37 348.5 12.5Q298 -12 242 -12Q150 -12 104.0 39.0Q58 90 58 186V528H257V210Q257 176 274.5 155.5Q292 135 324 135Q361 135 384.0 159.0Q407 183 407 218V528H606V0Z" fill="var(--ink)"/><path transform="translate(1748 0)" d="M412 528V393H300V192Q300 156 312.0 139.5Q324 123 356 123H412V6Q388 -2 350.0 -7.0Q312 -12 284 -12Q196 -12 148.5 20.0Q101 52 101 129V393H27V528H109L152 688H300V528Z" fill="var(--ink)"/><path transform="translate(2182 0)" d="M624 315H431Q431 405 333 405Q235 405 235 292V235Q235 123 337 123Q439 123 439 215H624Q624 100 543.5 44.0Q463 -12 333 -12Q194 -12 115.0 58.0Q36 128 36 264Q36 400 115.0 470.0Q194 540 333 540Q463 540 543.5 484.5Q624 429 624 315Z" fill="var(--ink)"/><path transform="translate(2839 0)" d="M424 540Q516 540 562.0 489.0Q608 438 608 342V0H409V318Q409 352 391.5 372.5Q374 393 342 393Q305 393 282.0 369.0Q259 345 259 310V0H60V725H259V473Q291 505 334.0 522.5Q377 540 424 540Z" fill="var(--ink)"/></g><path d="M 8 164 Q 273 176 538 164" fill="none" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round" /></svg></span>
    <p class="subtitle">Τα πάντα για την EuroLeague</p>

    <div class="grid">
      <!-- Predictions — "picks" bullseye, matching shared/nav-icon.ts exactly. -->
      <div class="panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" />
          <circle cx="12" cy="12" r="4.6" stroke="currentColor" stroke-width="1.8" />
          <circle cx="12" cy="12" r="1.5" fill="currentColor" />
        </svg>
        <span class="panel-label">Προβλέψεις</span>
      </div>

      <!-- Collectible cards — the fanned two-card glyph from nav-icon.ts. -->
      <div class="panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.2" y="6.5" width="9.5" height="13" rx="1.4" transform="rotate(-13 8 13)" stroke="currentColor" stroke-width="2" />
          <rect x="11.3" y="4.5" width="9.5" height="13" rx="1.4" transform="rotate(13 16 11)" stroke="currentColor" stroke-width="2" />
          <circle cx="16" cy="9.2" r="1.3" fill="currentColor" transform="rotate(13 16 11)" />
        </svg>
        <span class="panel-label">Συλλεκτικές<br />κάρτες</span>
      </div>

      <div class="qr-panel">
        <div class="qr-box" id="qr-card"></div>
        <p class="scan">Σκάναρε το QR και<br /><span>Clutch</span>-ώσε το</p>
      </div>

      <!-- Stats — the ranked-bars glyph from nav-icon.ts's "standings" case. -->
      <div class="panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="13" width="4.5" height="7" rx="1" stroke="currentColor" stroke-width="2" />
          <rect x="9.75" y="7" width="4.5" height="13" rx="1" stroke="currentColor" stroke-width="2" />
          <rect x="15.5" y="10" width="4.5" height="10" rx="1" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="panel-label">Στατιστικά</span>
      </div>

      <!-- Fantasy Five — the mini top-down court glyph from nav-icon.ts. -->
      <div class="panel">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="1.5" stroke="currentColor" stroke-width="2" />
          <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.3" />
          <circle cx="12" cy="12" r="2.3" stroke="currentColor" stroke-width="1.3" />
          <rect x="9" y="3" width="6" height="4.2" stroke="currentColor" stroke-width="1.3" />
          <rect x="9" y="16.8" width="6" height="4.2" stroke="currentColor" stroke-width="1.3" />
        </svg>
        <span class="panel-label">Fantasy</span>
      </div>
    </div>

    <p class="features">Στατιστικά &middot; Προβλέψεις &middot; Συλλεκτικές κάρτες &middot; Fantasy</p>
  </div>

  <!-- Vendored locally (vendor-qr-code-styling.js), not loaded from a CDN:
       the real production server's own CSP (backend/src/index.ts) scopes
       script-src to 'self' + 'unsafe-inline' — no external script host is
       allowlisted — so a <script src="https://cdn.jsdelivr.net/..."> tag
       is silently blocked by the browser on the live site (this file's
       QR never rendered for exactly this reason: QRCodeStyling was never
       defined, and the code below no-ops rather than throwing). Serving
       the library from this app's own origin needs no CSP change at all. -->
  <script src="/vendor-qr-code-styling.js"></script>
  <script>
    // No center logo: it caused two different failures across two rendering
    // modes (svg: could silently fail to load and leave a hidden-dots hole
    // per the library's own docs; canvas: likely blocks the *entire* paint
    // on that same image loading, since canvas compositing is imperative and
    // has no separate async layer the way svg's <image> does — so a stalled
    // load means nothing draws at all, not just a missing logo). A plain
    // code sidesteps both failure classes entirely — doubly so now that a
    // stylized/artistic QR render was explicitly considered and rejected in
    // favor of this library's real, verified-scannable output.
    (function () {
      var URL_TARGET = "https://getclutchapp.com/welcome";
      if (typeof QRCodeStyling === "undefined") return;
      var qr = new QRCodeStyling({
        width: 320,
        height: 320,
        type: "canvas",
        data: URL_TARGET,
        margin: 8,
        qrOptions: { errorCorrectionLevel: "H" },
        dotsOptions: { color: "#F0F0EC", type: "rounded" },
        cornersSquareOptions: { color: "#FF6B35", type: "extra-rounded" },
        cornersDotOptions: { color: "#FF6B35", type: "dot" },
        backgroundOptions: { color: "#151516" },
      });
      var el = document.getElementById("qr-card");
      if (el) qr.append(el);
    })();
  </script>
</body>
</html>
