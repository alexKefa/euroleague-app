<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8"/>
  <title>Clutch</title>
  <base href="/"/>
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="description" content="EuroLeague stats, predictions, and cards for your favorite team."/>
  <!-- Filenames themselves carry a "-v4"/"v4-" version marker, not just a
       ?v= query string: browsers/iOS/Android cache a favicon and a PWA's
       home-screen icon in ways that don't reliably revalidate against
       normal HTTP cache rules — a query-bust was tried first and didn't
       fully clear a stuck browser-tab favicon, so this is the more
       reliable fix. Bump the version marker on any future icon change —
       same idea for manifest.webmanifest's own icon list below. -->
  <link rel="icon" type="image/svg+xml" href="favicon-v7.svg"/>
  <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-v7-96x96.png"/>
  <meta id="theme-color-meta" name="theme-color" content="#0b1220"/>
  <link rel="apple-touch-icon" href="icons/icon-v7-192x192.png"/>

  <!-- iOS ignores the manifest's "display": "standalone" for its own
       home-screen behavior and needs this explicitly — without it, "Add to
       Home Screen" can fall back to opening in a regular Safari tab with
       the address bar instead of the chrome-free standalone window.
       Deliberately NOT setting apple-mobile-web-app-status-bar-style here:
       "black-translucent" would let content draw *under* the status bar,
       which needs safe-area-inset-top padding somewhere to avoid the top
       bar being hidden behind the clock/battery icons — this app only
       handles safe-area-inset-bottom today (app.component.html), so
       leaving the status bar at its default (reserved, non-overlapping)
       behavior is the safe choice. -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Clutch"/>

  <!-- Link-preview metadata — without these, sharing the URL fell back to
       whatever a platform's crawler could scrape on its own (nothing
       useful), which is what showed the framework's default icon instead
       of the app's. -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Clutch"/>
  <meta property="og:description" content="EuroLeague stats, predictions, and cards for your favorite team."/>
  <meta property="og:url" content="https://clutchapp.up.railway.app"/>
  <meta property="og:image" content="https://clutchapp.up.railway.app/og-image.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Clutch"/>
  <meta name="twitter:description" content="EuroLeague stats, predictions, and cards for your favorite team."/>
  <meta name="twitter:image" content="https://clutchapp.up.railway.app/og-image.png"/>
  <script>
    // Stamp the saved color scheme before Angular even loads, so a
    // returning visitor who chose light doesn't see a flash of the dark
    // default while the app bootstraps. Mirrors ThemeService's own
    // load/apply logic (frontend/src/app/core/theme.service.ts) — keep
    // the two in sync if that key or fallback ever changes.
    try {
      var scheme = localStorage.getItem("clutch-color-scheme") === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", scheme);
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
