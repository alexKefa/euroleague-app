<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8"/>
  <title>Clutch</title>
  <base href="/"/>
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="description" content="Στατιστικά, προβλέψεις και συλλεκτικές κάρτες για την αγαπημένη σου ομάδα στην Euroleague."/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-v14.png"/>
  <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-v14-96x96.png"/>
  <meta id="theme-color-meta" name="theme-color" content="#0b1220"/>
  <link rel="apple-touch-icon" href="icons/icon-v14-192x192.png"/>

  <!-- iOS ignores the manifest's "display": "standalone" for its own
       home-screen behavior and needs this explicitly — without it, "Add to
       Home Screen" can fall back to opening in a regular Safari tab with
       the address bar instead of the chrome-free standalone window.
       Deliberately NOT setting apple-mobile-web-app-status-bar-style here:
       "black-translucent" would let content draw *under* the status bar,
       which needs safe-area-inset-top padding somewhere to avoid the top
       bar being hidden behind the clock/battery icons — this app only
       handles safe-area-inset-bottom today (app.component.html), so
       leaving the status bar at its default (reserved, non-overlapping)
       behavior is the safe choice. -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Clutch"/>

  <!-- Link-preview metadata — without these, sharing the URL fell back to
       whatever a platform's crawler could scrape on its own (nothing
       useful), which is what showed the framework's default icon instead
       of the app's. og:image previously pointed at a real file that was
       never actually generated (og-image.png, 404) — that's why a shared
       link's preview showed no image at all; frontend/public/og-image.png
       is now a real 1200x630 asset (the brand mark + Greek copy, mirroring
       this document's own lang="el" default) rendered once via a headless
       Chrome pass, not hand-drawn. -->
  <meta property="og:type" content="website"/>
  <meta property="og:locale" content="el_GR"/>
  <meta property="og:title" content="Clutch"/>
  <meta property="og:description" content="Στατιστικά, προβλέψεις και συλλεκτικές κάρτες για την αγαπημένη σου ομάδα στην Euroleague."/>
  <meta property="og:url" content="https://getclutchapp.com"/>
  <meta property="og:image" content="https://getclutchapp.com/og-image.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Clutch"/>
  <meta name="twitter:description" content="Στατιστικά, προβλέψεις και συλλεκτικές κάρτες για την αγαπημένη σου ομάδα στην Euroleague."/>
  <meta name="twitter:image" content="https://getclutchapp.com/og-image.png"/>
  <script>
    // Stamp the saved color scheme before Angular even loads, so a
    // returning visitor who chose light doesn't see a flash of the dark
    // default while the app bootstraps. Mirrors ThemeService's own
    // load/apply logic (frontend/src/app/core/theme.service.ts) — keep
    // the two in sync if that key or fallback ever changes.
    try {
      var scheme = localStorage.getItem("clutch-color-scheme") === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", scheme);
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
