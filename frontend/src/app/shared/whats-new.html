<!-- Positioned by the shared toast stack in app.component.html. -->
@for (a of pending(); track a.id) {
  <div class="toast-pop pointer-events-auto mb-3 bg-card border-2 border-line rounded-2xl shadow-pop p-4" role="status">
    <div class="flex items-start gap-3">
      <div class="toast-icon w-9 h-9 rounded-full bg-team-primary/10 flex items-center justify-center shrink-0">
        <app-nav-icon [name]="icon(a)" [size]="20" class="text-team-primary" />
      </div>
      <div class="min-w-0 flex-1 break-words">
        <p class="text-[11px] font-mono font-bold uppercase tracking-wide text-team-primary">{{ i18n.t('whatsNew.label') }}</p>
        <p class="text-sm font-semibold">{{ title(a) }}</p>
        <p class="text-xs text-muted mt-0.5">{{ body(a) }}</p>
      </div>
      <button
        type="button"
        (click)="dismiss(a)"
        class="text-muted hover:text-ink text-lg leading-none shrink-0"
        [attr.aria-label]="i18n.t('hint.dismiss')"
      >
        &times;
      </button>
    </div>
    @if (a.link && cta(a)) {
      <button type="button" (click)="open(a)" appButton appButtonSize="sm" class="w-full mt-3">
        {{ cta(a) }}
      </button>
    }
  </div>
}
