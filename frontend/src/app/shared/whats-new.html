<!-- Positioned by the shared toast stack in app.component.html.
     Compact pill (2026-09-29, "too much info"): title only; tapping it
     follows the link, or expands the body when there's no link. -->
@for (a of pending(); track a.id) {
  <div class="toast-pop toast-pill pointer-events-auto mb-2" role="status">
    <div class="flex items-center gap-2.5">
      <span class="toast-pill-icon"><app-nav-icon [name]="icon(a)" [size]="18" /></span>
      <button type="button" class="min-w-0 flex-1 text-left" (click)="a.link ? open(a) : toggle(a.id)">
        <span class="block text-[10px] font-bold uppercase tracking-wider text-team-primary leading-none mb-0.5">{{ i18n.t('whatsNew.label') }}</span>
        <span class="block text-[13px] font-semibold leading-snug" [class.line-clamp-2]="expandedId() !== a.id">{{ title(a) }}</span>
      </button>
      @if (a.link && cta(a)) {
        <button type="button" (click)="open(a)" class="toast-action">{{ cta(a) }}</button>
      }
      <button type="button" (click)="dismiss(a)" class="toast-x" [attr.aria-label]="i18n.t('hint.dismiss')">&times;</button>
    </div>
    @if (expandedId() === a.id) {
      <p class="text-[12px] text-muted leading-relaxed mt-2 px-1">{{ body(a) }}</p>
    }
  </div>
}
