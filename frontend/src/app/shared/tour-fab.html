@if (visible()) {
  <div class="fixed z-40 bottom-[calc(5.5rem+env(safe-area-inset-bottom))] right-4 sm:bottom-6 sm:right-6">
    <!-- Pulsing halo behind the pill — sized to match it via inset-0 on a
         wrapper with no explicit width/height of its own (shrink-to-fit
         around the button), same "ring behind the real element" trick as
         the mobile nav's old (since-removed) active-tab treatments. -->
    <span class="absolute inset-0 rounded-full bg-highlight/60 animate-ping motion-reduce:hidden"></span>
    <button
      type="button"
      (click)="start()"
      class="relative flex items-center gap-2 pl-3 pr-4 py-2.5 rounded-full bg-highlight text-white font-display text-sm font-bold shadow-pop hover:brightness-110 active:brightness-95 transition-[filter]"
    >
      <app-nav-icon name="compass" [size]="18" class="text-white" />
      {{ i18n.t('tour.takeTour') }}
    </button>
    <button
      type="button"
      (click)="dismiss()"
      [attr.aria-label]="i18n.t('tour.skip')"
      class="absolute -top-2 -left-2 w-6 h-6 rounded-full bg-card border border-line shadow-card flex items-center justify-center text-muted hover:text-ink transition-colors text-sm leading-none"
    >
      &times;
    </button>
  </div>
}
