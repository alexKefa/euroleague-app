<div
  class="splash-root fixed inset-0 z-[100] flex flex-col items-center justify-center bg-page transition-opacity duration-[400ms] overflow-hidden"
  [class.opacity-0]="hiding"
>
  <!-- Big, faint background watermark — an original basketball motif (same
       glyph as nav-icon.ts's "ball" case), not the EuroLeague brand mark. -->
  <svg
    class="watermark absolute inset-0 m-auto"
    width="80vmin"
    height="80vmin"
    viewBox="0 0 24 24"
    fill="none"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="8.5" stroke="#FF6B35" stroke-width="0.15" fill="#FF6B35" fill-opacity="0.5" />
    <path
      d="M12 3.5v17M3.5 12h17M6 6c2 2 2 10-0.5 12M18 6c-2 2-2 10 0.5 12"
      stroke="#FF6B35"
      stroke-width="0.12"
      stroke-linecap="round"
    />
  </svg>

  <div class="relative flex flex-col items-center gap-4">
    <svg width="104" height="104" viewBox="0 0 100 100">
      <g class="bar bar-1">
        <polygon points="21,58 31,52 31,80 21,86" fill="#5E2513"/>
        <polygon points="31,52 41,58 41,86 31,80" fill="#8B3A22"/>
        <polygon points="21,58 31,52 41,58 31,64" fill="#C1552F"/>
      </g>
      <g class="bar bar-2">
        <polygon points="43,26 53,20 53,80 43,86" fill="#B84A26"/>
        <polygon points="53,20 63,26 63,86 53,80" fill="#FF6B35"/>
        <polygon points="43,26 53,20 63,26 53,32" fill="#FF9D6E"/>
      </g>
      <g class="bar bar-3">
        <polygon points="65,42 75,36 75,80 65,86" fill="#8E351B"/>
        <polygon points="75,36 85,42 85,86 75,80" fill="#C94A24"/>
        <polygon points="65,42 75,36 85,42 75,48" fill="#E27A4C"/>
      </g>
    </svg>
    <div class="flex flex-col items-center gap-1">
      <p class="wordmark font-display text-3xl tracking-wide" style="color: var(--color-ink)">Clutch</p>
      <p class="tagline font-mono text-xs font-bold uppercase tracking-wider text-muted">{{ i18n.t('splash.tagline') }}</p>
    </div>
  </div>
</div>
