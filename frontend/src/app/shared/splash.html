<div
  class="splash-root fixed inset-0 z-[100] flex flex-col items-center justify-center bg-page transition-opacity duration-[400ms]"
  [class.opacity-0]="hiding"
>
  <div class="flex flex-col items-center gap-4">
    <svg width="88" height="88" viewBox="0 0 24 24" fill="none">
      <rect class="bar bar-1" x="4" y="13" width="5" height="8" rx="1.3" fill="#FF6B35" opacity="0.5" />
      <rect class="bar bar-2" x="10.5" y="6.5" width="5" height="14.5" rx="1.3" fill="#FF6B35" />
      <rect class="bar bar-3" x="17" y="10" width="5" height="11" rx="1.3" fill="#FF6B35" opacity="0.75" />
    </svg>
    <p class="wordmark font-display text-3xl tracking-wide" style="color: var(--color-ink)">Clutch</p>
  </div>
</div>
