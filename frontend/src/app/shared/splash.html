<div
  class="splash-root fixed inset-0 z-[100] flex flex-col items-center justify-center gap-3 bg-page transition-opacity duration-[400ms] overflow-hidden"
  [class.opacity-0]="hiding"
>
  <!-- v14 (2026-09-14) — a new user-supplied "C"-swoosh basketball/hoop
       mark with a baked-in serif "Clutch" wordmark, replacing v9/v10's
       backboard/net illustration. See app.component.html's comment for
       the fuller history/dark-theme-variant rationale. -->
  <div class="relative px-6 max-w-[92vw]" aria-label="Clutch" role="img">
    <div class="logo-scan-wrap">
      <img src="/clutch-mark.png" alt="" class="logo-mark brand-mark-light" />
      <img src="/clutch-mark-dark.png" alt="" class="logo-mark brand-mark-dark" />
    </div>
  </div>

  <!-- Tagline — a plain centered line now (the old curved-text treatment
       traced the ball watermark's own circle, which no longer exists in
       this design; the free-throw circle behind isn't dead-center on
       screen the way the ball was, so tracing it would look accidental
       rather than deliberate). -->
  <p class="tagline-flat" [attr.aria-label]="'Clutch' + i18n.t('splash.taglineSuffix')">
    <span class="tagline-flat-brand">Clutch</span>{{ i18n.t('splash.taglineSuffix') }}
  </p>
</div>
