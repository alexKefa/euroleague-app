<div
  class="splash-root fixed inset-0 z-[100] flex flex-col items-center justify-center gap-3 bg-page transition-opacity duration-[400ms] overflow-hidden"
  [class.opacity-0]="hiding"
>
  <!-- Half-court diagram, stroking itself on like a technical readout
       (2026-09-13, replacing the earlier card-fan + basketball-watermark
       concept — see splash.ts's header comment for why). Same real court
       geometry as features/player/shot-chart.ts's shot chart (viewBox
       320x210, basket at 160,185) rather than invented coordinates, so this
       reads as "this app's actual court," the same continuity reasoning
       the old card fan used real player photos for. Absolutely centered
       behind the wordmark, same "inset-0 m-auto" layering the old watermark
       used. -->
  <svg
    class="court-diagram absolute inset-0 m-auto"
    width="84vmin"
    height="55vmin"
    viewBox="0 0 320 210"
    fill="none"
    aria-hidden="true"
  >
    <!-- Sidelines + far baseline (open at the near baseline, same as
         shot-chart.ts's courtOutlinePath — the basket end stays open,
         implied by the backboard/rim marks instead of a drawn line). -->
    <path class="court-line court-line--outline" d="M 6 210 L 6 6 L 314 6 L 314 210" />
    <!-- Key / paint -->
    <rect class="court-line court-line--key" x="111" y="96" width="98" height="114" />
    <!-- Free-throw circle -->
    <circle class="court-line court-line--ft-circle" cx="160" cy="96" r="18" />
    <!-- Three-point arc (FIBA corner-3 straight sections + the arc between) -->
    <path
      class="court-line court-line--arc"
      d="M 28 210 L 28 156.7 A 135 135 0 0 1 292 156.7 L 292 210"
    />
    <!-- Backboard -->
    <line class="court-mark court-mark--backboard" x1="142" x2="178" y1="188" y2="188" />
    <!-- Rim -->
    <circle class="court-mark court-mark--rim" cx="160" cy="185" r="4.5" />
  </svg>

  <!-- The logo — "Pure Wordmark" (2026-09-12), see app.component.html's
       comment for the full rationale. Normal-flow flex child so
       justify-center/items-center centers it exactly over the court
       diagram behind it. -->
  <div class="relative px-6 max-w-[92vw]" aria-label="Clutch" role="img">
    <svg class="logo-mark" viewBox="0 0 600 200" aria-hidden="true">
      <g transform="translate(8 140) scale(0.15117 -0.15117)"><path transform="translate(0 0)" d="M733 405H522Q522 465 490.5 500.0Q459 535 401 535Q334 535 302.5 493.0Q271 451 271 376V312Q271 238 302.5 195.5Q334 153 399 153Q463 153 496.0 186.0Q529 219 529 279H733Q733 138 646.5 63.0Q560 -12 402 -12Q226 -12 135.5 78.0Q45 168 45 344Q45 520 135.5 610.0Q226 700 402 700Q555 700 644.0 623.5Q733 547 733 405Z" fill="var(--color-ink)"/><path transform="translate(768 0)" d="M67 0V725H266V0Z" fill="var(--color-ink)"/><path transform="translate(1091 0)" d="M443 0 430 80Q399 37 348.5 12.5Q298 -12 242 -12Q150 -12 104.0 39.0Q58 90 58 186V528H257V210Q257 176 274.5 155.5Q292 135 324 135Q361 135 384.0 159.0Q407 183 407 218V528H606V0Z" fill="var(--color-ink)"/><path transform="translate(1748 0)" d="M412 528V393H300V192Q300 156 312.0 139.5Q324 123 356 123H412V6Q388 -2 350.0 -7.0Q312 -12 284 -12Q196 -12 148.5 20.0Q101 52 101 129V393H27V528H109L152 688H300V528Z" fill="var(--color-ink)"/><path transform="translate(2182 0)" d="M624 315H431Q431 405 333 405Q235 405 235 292V235Q235 123 337 123Q439 123 439 215H624Q624 100 543.5 44.0Q463 -12 333 -12Q194 -12 115.0 58.0Q36 128 36 264Q36 400 115.0 470.0Q194 540 333 540Q463 540 543.5 484.5Q624 429 624 315Z" fill="var(--color-ink)"/><path transform="translate(2839 0)" d="M424 540Q516 540 562.0 489.0Q608 438 608 342V0H409V318Q409 352 391.5 372.5Q374 393 342 393Q305 393 282.0 369.0Q259 345 259 310V0H60V725H259V473Q291 505 334.0 522.5Q377 540 424 540Z" fill="var(--color-ink)"/></g>
      <path d="M 8 164 Q 273 176 538 164" fill="none" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Tagline — a plain centered line now (the old curved-text treatment
       traced the ball watermark's own circle, which no longer exists in
       this design; the free-throw circle behind isn't dead-center on
       screen the way the ball was, so tracing it would look accidental
       rather than deliberate). -->
  <p class="tagline-flat" [attr.aria-label]="'Clutch' + i18n.t('splash.taglineSuffix')">
    <span class="tagline-flat-brand">Clutch</span>{{ i18n.t('splash.taglineSuffix') }}
  </p>
</div>
