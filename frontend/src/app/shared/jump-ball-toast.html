@if (visible()) {
  <!-- Positioned by the shared toast stack in app.component.html.
       Compact pill (2026-09-29): one line + Spin. -->
  <div class="toast-pop toast-pill pointer-events-auto mb-2" role="status">
    <div class="flex items-center gap-2.5">
      <span class="toast-pill-icon toast-pill-icon--spin"><app-nav-icon name="wheel" [size]="18" /></span>
      <p class="min-w-0 flex-1 text-[13px] font-semibold leading-snug line-clamp-2">{{ i18n.t('wheel.toastReady') }}</p>
      <button type="button" (click)="spin()" class="toast-action">{{ i18n.t('wheel.toastSpin') }}</button>
      <button type="button" (click)="dismiss()" class="toast-x" [attr.aria-label]="i18n.t('hint.dismiss')">&times;</button>
    </div>
  </div>
}
