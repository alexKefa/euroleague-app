<div
  class="relative w-full mx-auto rounded-2xl"
  [class.ring-4]="selected"
  [class.ring-highlight]="selected"
  [style.max-width.px]="maxWidth"
  style="aspect-ratio: 2.5 / 3.5"
>
  <div
    class="w-full h-full rounded-2xl transition-[filter] duration-300"
    [style.padding.px]="7"
    [style.background]="style.frameBackground"
    [style.box-shadow]="style.frameShadow"
    [style.filter]="unlocked ? 'none' : 'grayscale(0.75) brightness(0.55)'"
  >
    <div
      class="relative w-full h-full rounded-xl overflow-hidden"
      [style.background]="style.faceBackground"
    >
      <!-- Full-bleed photo -->
      <div class="absolute inset-0" [style.background]="style.photoTint">
        @if (imageUrl) {
          <img
            [src]="imageUrl"
            [alt]="name"
            loading="lazy"
            decoding="async"
            appRetryImg
            (load)="imageLoaded.set(true)"
            class="absolute inset-0 w-full h-full object-cover object-top transition-opacity duration-200"
            [class.opacity-0]="!imageLoaded()"
          />
          @if (!imageLoaded()) {
            <div class="absolute inset-0 flex items-center justify-center">
              <app-logo-spinner [size]="22" class="opacity-50" />
            </div>
          }
        } @else {
          <div class="absolute inset-0 flex items-center justify-center">
            <svg width="66%" height="66%" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <path
                d="M22,6 L32,17 L42,6 L50,14 L54,24 L47,21 L47,58 L17,58 L17,21 L10,24 L14,14 Z"
                [attr.fill]="style.iconColor"
                fill-opacity="0.55"
              />
              <path
                d="M22,6 L32,17 L42,6"
                fill="none"
                [attr.stroke]="style.iconAccent"
                stroke-opacity="0.8"
                stroke-width="2.5"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            </svg>
          </div>
        }
      </div>

      @if (style.holoVariant) {
        <div
          class="holo-sweep absolute pointer-events-none"
          [class.holo-sweep--gold]="style.holoVariant === 'gold' && !isFoil"
          [class.holo-sweep--silver]="style.holoVariant === 'silver'"
          [class.holo-sweep--prismatic]="isFoil"
        ></div>
      }

      <div
        class="absolute top-2 right-2 flex items-center gap-1 rounded-full z-10"
        style="padding: 3px 8px 3px 6px"
        [style.background]="style.badgeBackground"
      >
        <span class="text-[10px] font-extrabold tracking-wider" [style.color]="style.badgeTextColor">
          @if (isFoil) {
            <span aria-hidden="true">&#10022;&nbsp;</span>
          }{{ style.badgeLabel }}</span
        >
      </div>

      <!-- print numbering — mirrors the tier badge on the opposite corner -->
      @if (showSerial) {
        <div
          class="absolute top-2 left-2 rounded-full z-10 backdrop-blur-sm"
          style="padding: 3px 7px"
          [style.background]="style.bannerBackground"
        >
          <span class="font-mono text-[9px] font-medium" [style.color]="style.metaColor"
            >{{ serialNumber }}/{{ serialTotal }}</span
          >
        </div>
      }

      <!-- Frosted-glass info banner, floating over the bottom of the photo -->
      <div
        class="absolute inset-x-0 bottom-0 px-3 py-2.5 backdrop-blur-md z-10"
        [style.background]="style.bannerBackground"
      >
        <div class="text-[15px] font-extrabold leading-tight truncate" [style.color]="style.nameColor">
          {{ name }}
        </div>
        <div class="text-[11px] font-bold tracking-wide" [style.color]="style.metaColor">{{ displayTeamCode }}</div>
      </div>
    </div>
  </div>

  @if (!unlocked) {
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <rect x="5" y="10" width="14" height="10" rx="2" stroke="#F5F7F6" stroke-width="1.8" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#F5F7F6" stroke-width="1.8" />
      </svg>
    </div>
  }
</div>
