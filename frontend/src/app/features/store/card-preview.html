<div
  class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm"
  (click)="close()"
>
  <button
    type="button"
    (click)="close()"
    class="absolute top-4 right-4 text-white/80 hover:text-white text-3xl leading-none font-bold"
    aria-label="Close preview"
  >
    &times;
  </button>

  <div class="flex flex-col items-center gap-4" style="width: min(85vw, 380px)" (click)="$event.stopPropagation()">
    <div
      class="w-full select-none"
      style="touch-action: none"
      [style.cursor]="isDragging() ? 'grabbing' : 'grab'"
      [style.transform]="'perspective(900px) rotateY(' + dragRotation() + 'deg)'"
      [style.transition]="isDragging() ? 'none' : 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)'"
      (pointerdown)="onCardPointerDown($event)"
      (pointermove)="onCardPointerMove($event)"
      (pointerup)="onCardPointerUp($event)"
      (pointercancel)="onCardPointerUp($event)"
    >
      <app-collectible-card
        class="w-full pointer-events-none"
        [name]="item.name"
        [tier]="item.tier"
        [teamCode]="item.team.code"
        [teamColor]="item.team.primaryColor"
        [imageUrl]="item.imageUrl"
        [unlocked]="unlocked"
        [maxWidth]="380"
      ></app-collectible-card>
    </div>

    <div class="text-center">
      <p class="font-display text-xl uppercase tracking-wide text-white">{{ item.name }}</p>
      <p class="font-mono text-white/60 text-[13px] font-bold uppercase tracking-wide mt-1">{{ item.team.code }}</p>
    </div>

    <ng-content></ng-content>
  </div>
</div>
