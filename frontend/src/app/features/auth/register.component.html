<div class="max-w-sm mx-auto p-6">
  <h1 class="font-display text-2xl uppercase tracking-wide mb-5">Create an account</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <input
      type="email"
      formControlName="email"
      placeholder="Email"
      class="w-full px-4 py-3 rounded-lg bg-card border border-line text-sm font-semibold focus:border-highlight outline-none"
    />
    <input
      type="password"
      formControlName="password"
      placeholder="Password (min 8 characters)"
      class="w-full px-4 py-3 rounded-lg bg-card border border-line text-sm font-semibold focus:border-highlight outline-none"
    />

    @if (teams().length > 0) {
      <div>
        <p class="font-mono text-[12px] text-muted font-bold uppercase tracking-wide mb-2">
          Favorite team (optional)
        </p>
        <div class="flex flex-wrap gap-2">
          @for (team of teams(); track team.id) {
            <button
              type="button"
              (click)="pickTeam(team.id)"
              class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-card border-[1.5px] border-transparent hover:shadow-pop transition-all"
              [style.borderColor]="favoriteTeamId() === team.id ? team.primaryColor : 'transparent'"
            >
              <span class="w-1.5 h-1.5 rounded-full" [style.background]="team.primaryColor"></span>
              <span class="font-display text-xs">{{ team.code }}</span>
            </button>
          }
        </div>
      </div>
    }

    @if (error()) {
      <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="w-full py-3 rounded-full bg-highlight text-white font-mono text-xs font-bold uppercase tracking-wide hover:bg-highlight-dim transition-colors disabled:opacity-50"
    >
      {{ submitting() ? "Creating account…" : "Create account" }}
    </button>
  </form>

  <p class="text-xs text-muted font-semibold mt-4">
    Already have an account? <a routerLink="/login" class="text-highlight">Log in</a>
  </p>
</div>
