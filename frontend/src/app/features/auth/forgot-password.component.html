<div class="min-h-[70vh] flex flex-col items-center justify-center px-6 py-10">
  <!-- The logo — v14 (2026-09-14), a new user-supplied "C"-swoosh
       basketball/hoop mark with a baked-in serif "Clutch" wordmark; see
       app.component.html's comment for the full history/rationale. Sized
       up from v9/v10's 64px so the baked-in text stays legible (this
       art's wordmark sits well below the graphic, not beside it, so it
       needs more height than a horizontal lockup would for the same
       readable text size). Light/dark pair, same reasoning as the nav. -->
  <div class="mb-9">
    <img src="/clutch-mark.png" alt="Clutch" height="96" class="brand-mark-light" style="height: 96px; width: auto;" />
    <img src="/clutch-mark-dark.png" alt="Clutch" height="96" class="brand-mark-dark" style="height: 96px; width: auto;" />
  </div>

  <div class="relative w-full max-w-sm overflow-hidden rounded-[28px] bg-highlight/10 backdrop-blur-xl border border-highlight/25 shadow-pop px-6 py-8">
    <div
      class="pointer-events-none absolute inset-0"
      style="background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.14) 45%, rgba(124,108,240,0.18) 52%, transparent 65%)"
    ></div>

    <div class="relative">
      <h1 class="font-mono text-xs font-bold tracking-widest uppercase text-highlight mb-2">
        {{ i18n.t('auth.forgotPasswordTitle') }}
      </h1>

      @if (!sent()) {
        <p class="text-xs text-muted font-semibold mb-4">{{ i18n.t('auth.forgotPasswordHint') }}</p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
          <input
            type="email"
            formControlName="email"
            [placeholder]="i18n.t('auth.emailPlaceholder')"
            class="w-full px-4 py-3 rounded-2xl bg-page/40 border-2 border-highlight/20 text-sm font-semibold placeholder:text-muted focus:border-highlight outline-none"
          />

          @if (error()) {
            <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
          }

          <button type="submit" [disabled]="form.invalid || submitting()" appButton class="w-full mt-1">
            {{ submitting() ? i18n.t('auth.sendingResetLink') : i18n.t('auth.sendResetLink') }}
          </button>
        </form>
      } @else {
        <p class="text-sm font-semibold">{{ i18n.t('auth.resetLinkSent') }}</p>
      }

      <p class="text-xs text-center mt-4">
        <a routerLink="/login" class="text-highlight font-semibold">{{ i18n.t('auth.backToLogin') }}</a>
      </p>
    </div>
  </div>
</div>
