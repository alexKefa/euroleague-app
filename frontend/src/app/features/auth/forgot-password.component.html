<div class="min-h-[70vh] flex flex-col items-center justify-center px-6 py-10">
  <!-- The logo — v14 (2026-09-14), a new user-supplied "C"-swoosh
       basketball/hoop mark with a baked-in serif "Clutch" wordmark; see
       app.component.html's comment for the full history/rationale. Sized
       up from v9/v10's 64px so the baked-in text stays legible (this
       art's wordmark sits well below the graphic, not beside it, so it
       needs more height than a horizontal lockup would for the same
       readable text size). Light/dark pair, same reasoning as the nav. -->
  <div class="mb-9">
    <img src="/brand/clutch-mark.svg" alt="Clutch" height="96" class="brand-mark-light" style="height: 96px; width: auto;" />
    <img src="/brand/clutch-mark-dark.svg" alt="Clutch" height="96" class="brand-mark-dark" style="height: 96px; width: auto;" />
  </div>

  <div class="relative w-full max-w-sm overflow-hidden rounded-3xl bg-card border border-line shadow-pop px-5 py-6 sm:px-6 sm:py-7">
    <div
      class="pointer-events-none absolute inset-0"
      style="background: linear-gradient(135deg, color-mix(in srgb, var(--accent-primary) 24%, transparent) 0%, color-mix(in srgb, var(--accent-primary) 5%, transparent) 50%, transparent 100%)"
    ></div>

    <div class="relative">
      <h1 class="font-mono text-xs font-bold tracking-widest uppercase text-team-primary mb-2">
        {{ i18n.t('auth.forgotPasswordTitle') }}
      </h1>

      @if (!sent()) {
        <p class="text-xs text-muted font-semibold mb-4">{{ i18n.t('auth.forgotPasswordHint') }}</p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
          <input
            type="email"
            formControlName="email"
            [placeholder]="i18n.t('auth.emailPlaceholder')"
            class="w-full h-12 px-4 rounded-2xl bg-page border-2 border-line text-[15px] font-semibold placeholder:text-muted focus:border-team-primary outline-none transition-colors"
          />

          @if (error()) {
            <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
          }

          <button type="submit" [disabled]="form.invalid || submitting()" appButton class="w-full !h-12 !rounded-2xl text-base mt-2">
            {{ submitting() ? i18n.t('auth.sendingResetLink') : i18n.t('auth.sendResetLink') }}
          </button>
        </form>
      } @else {
        <p class="text-sm font-semibold">{{ i18n.t('auth.resetLinkSent') }}</p>
      }

      <p class="text-xs text-center mt-4">
        <a routerLink="/login" class="text-team-primary font-semibold">{{ i18n.t('auth.backToLogin') }}</a>
      </p>
    </div>
  </div>
</div>
