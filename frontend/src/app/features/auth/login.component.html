<div class="min-h-[70vh] flex flex-col items-center justify-center px-6 py-10">
  <!-- The logo — v14 (2026-09-14), a new user-supplied "C"-swoosh
       basketball/hoop mark with a baked-in serif "Clutch" wordmark; see
       app.component.html's comment for the full history/rationale. Sized
       up from v9/v10's 64px so the baked-in text stays legible (this
       art's wordmark sits well below the graphic, not beside it, so it
       needs more height than a horizontal lockup would for the same
       readable text size). Light/dark pair, same reasoning as the nav. -->
  <div class="mb-9">
    <img src="/brand/clutch-mark.svg" alt="Clutch" height="96" class="brand-mark-light" style="height: 96px; width: auto;" />
    <img src="/brand/clutch-mark-dark.svg" alt="Clutch" height="96" class="brand-mark-dark" style="height: 96px; width: auto;" />
  </div>

  <!-- Glass capsule panel — same backdrop-blur/highlight-tint/highlight-border
       treatment as the mobile bottom nav's floating capsule (app.component.html),
       plus a diagonal holo-sweep shimmer echoing the collectible cards' tier
       gradient (features/store/collectible-card). Picked as "Direction C" from
       a 3-direction canvas comparison. -->
  <div class="relative w-full max-w-sm overflow-hidden rounded-3xl bg-card border border-line shadow-pop px-5 py-6 sm:px-6 sm:py-7">
    <div
      class="pointer-events-none absolute inset-0"
      style="background: linear-gradient(135deg, color-mix(in srgb, var(--accent-primary) 24%, transparent) 0%, color-mix(in srgb, var(--accent-primary) 5%, transparent) 50%, transparent 100%)"
    ></div>

    <div class="relative">
      <h1 class="font-display text-2xl leading-tight">{{ i18n.t('auth.welcomeBack') }}</h1>
      <p class="text-[13px] text-muted mt-1 mb-5">{{ i18n.t('auth.loginSubtitle') }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-muted pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input
          type="email"
          formControlName="email"
          [placeholder]="i18n.t('auth.emailPlaceholder')"
          class="w-full h-12 pl-11 pr-4 rounded-2xl bg-page border-2 border-line text-[15px] font-semibold placeholder:text-muted focus:border-team-primary outline-none transition-colors"
        />
        </div>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-muted pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          [placeholder]="i18n.t('auth.passwordPlaceholder')"
          class="w-full h-12 pl-11 pr-12 rounded-2xl bg-page border-2 border-line text-[15px] font-semibold placeholder:text-muted focus:border-team-primary outline-none transition-colors"
        />
          <button type="button" (click)="showPassword.set(!showPassword())" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-xl flex items-center justify-center text-muted hover:text-ink transition-colors" [attr.aria-label]="showPassword() ? i18n.t('auth.hidePassword') : i18n.t('auth.showPassword')">
              @if (showPassword()) {
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.1A10 10 0 0122 12a13 13 0 01-2.2 3.1M6.1 6.1A13 13 0 002 12a10 10 0 0014.1 5.9"/></svg>
              } @else {
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
        </div>

        @if (error()) {
          <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || submitting()" appButton class="w-full !h-12 !rounded-2xl text-base mt-2">
          {{ submitting() ? i18n.t('auth.loggingIn') : i18n.t('nav.login') }}
        </button>
      </form>
      <app-google-sign-in-button [referralCode]="pendingReferral" [promoCode]="pendingPromo" (signedIn)="onGoogleSignIn($event)" (failed)="error.set(i18n.t($event))" />

      <p class="text-[13px] text-center mt-4">
        <a routerLink="/forgot-password" class="text-team-primary font-semibold">{{ i18n.t('auth.forgotPasswordLink') }}</a>
      </p>
      <div class="flex items-center gap-3 my-5">
        <span class="flex-1 h-px bg-line"></span>
        <span class="text-[12px] text-muted font-semibold">{{ i18n.t('auth.noAccount') }}</span>
        <span class="flex-1 h-px bg-line"></span>
      </div>
      <a routerLink="/register" appButton="outline" class="w-full !h-12 !rounded-2xl text-base">{{ i18n.t('nav.register') }}</a>
    </div>
  </div>


</div>

@if (showTeamDialog()) {
  <app-team-pick-dialog (closed)="onTeamDialogClosed()" />
}
