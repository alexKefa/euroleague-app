<div class="max-w-sm mx-auto p-6">
  <h1 class="font-display text-2xl uppercase tracking-wide mb-5">{{ i18n.t('nav.login') }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <input
      type="email"
      formControlName="email"
      [placeholder]="i18n.t('auth.emailPlaceholder')"
      class="w-full px-4 py-3 rounded-lg bg-card border border-line text-sm font-semibold focus:border-highlight outline-none"
    />
    <input
      type="password"
      formControlName="password"
      [placeholder]="i18n.t('auth.passwordPlaceholder')"
      class="w-full px-4 py-3 rounded-lg bg-card border border-line text-sm font-semibold focus:border-highlight outline-none"
    />

    @if (error()) {
      <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="w-full py-3 rounded-full bg-highlight text-white font-mono text-xs font-bold uppercase tracking-wide hover:bg-highlight-dim transition-colors disabled:opacity-50"
    >
      {{ submitting() ? i18n.t('auth.loggingIn') : i18n.t('nav.login') }}
    </button>
  </form>

  <p class="text-xs text-muted font-semibold mt-4">
    {{ i18n.t('auth.noAccount') }} <a routerLink="/register" class="text-highlight">{{ i18n.t('nav.register') }}</a>
  </p>
</div>
