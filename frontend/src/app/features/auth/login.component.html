<div class="max-w-sm mx-auto p-6">
  <h1 class="text-xl font-display font-bold mb-4">Log in</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <input
      type="email"
      formControlName="email"
      placeholder="Email"
      class="w-full px-3 py-2 rounded bg-panel border border-hairline text-sm focus:border-amber outline-none"
    />
    <input
      type="password"
      formControlName="password"
      placeholder="Password"
      class="w-full px-3 py-2 rounded bg-panel border border-hairline text-sm focus:border-amber outline-none"
    />

    @if (error()) {
      <p class="text-red-400 text-xs">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="w-full py-2 rounded bg-amber text-ink text-sm font-medium hover:bg-amber-dim transition-colors disabled:opacity-50"
    >
      {{ submitting() ? "Logging in…" : "Log in" }}
    </button>
  </form>

  <p class="text-xs text-muted mt-4">
    No account? <a routerLink="/register" class="text-amber">Register</a>
  </p>
</div>
