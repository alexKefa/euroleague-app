<div class="min-h-[70vh] flex flex-col items-center justify-center px-6 py-10">
  <!-- The logo — see app.component.html's comment for the full rationale. -->
  <div class="mb-9">
    <svg role="img" aria-label="Clutch" width="106" height="60" viewBox="0 0 264 150">
      <defs>
        <radialGradient id="ballGradHero" cx="35%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#FF9E70"/>
          <stop offset="55%" stop-color="#FF6B35"/>
          <stop offset="100%" stop-color="#C94A24"/>
        </radialGradient>
        <linearGradient id="lineGradHero" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#C94A24"/>
          <stop offset="100%" stop-color="#FF6B35"/>
        </linearGradient>
        <linearGradient id="textGradHero" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" style="stop-color:var(--color-ink)"/>
          <stop offset="100%" style="stop-color:var(--color-ink)" stop-opacity="0.82"/>
        </linearGradient>
        <filter id="shadowHero" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF6B35" flood-opacity="0.4"/>
        </filter>
      </defs>
      <text x="0" y="74" font-family="'IBM Plex Sans',sans-serif" font-weight="800" font-size="80" textLength="220" lengthAdjust="spacingAndGlyphs" fill="url(#textGradHero)">Clutch</text>
      <path d="M 0 98 Q 110 124 220 92" fill="none" stroke="url(#lineGradHero)" stroke-width="5" stroke-linecap="round" filter="url(#shadowHero)"/>
      <circle cx="240" cy="86" r="15" fill="url(#ballGradHero)" filter="url(#shadowHero)"/>
      <path d="M 240 72 L 240 100" stroke="rgba(0,0,0,0.3)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 229 76 Q 235.5 86 229 96" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 251 76 Q 244.5 86 251 96" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Glass capsule panel — same backdrop-blur/highlight-tint/highlight-border
       treatment as the mobile bottom nav's floating capsule (app.component.html),
       plus a diagonal holo-sweep shimmer echoing the collectible cards' tier
       gradient (features/store/collectible-card). Picked as "Direction C" from
       a 3-direction canvas comparison. -->
  <div class="relative w-full max-w-sm overflow-hidden rounded-[28px] bg-highlight/10 backdrop-blur-xl border border-highlight/25 shadow-pop px-6 py-8">
    <div
      class="pointer-events-none absolute inset-0"
      style="background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.14) 45%, rgba(124,108,240,0.18) 52%, transparent 65%)"
    ></div>

    <div class="relative">
      <h1 class="font-mono text-xs font-bold tracking-widest uppercase text-highlight mb-5">
        {{ i18n.t('nav.login') }}
      </h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
        <input
          type="email"
          formControlName="email"
          [placeholder]="i18n.t('auth.emailPlaceholder')"
          class="w-full px-4 py-3 rounded-2xl bg-page/40 border-2 border-highlight/20 text-sm font-semibold placeholder:text-muted focus:border-highlight outline-none"
        />
        <input
          type="password"
          formControlName="password"
          [placeholder]="i18n.t('auth.passwordPlaceholder')"
          class="w-full px-4 py-3 rounded-2xl bg-page/40 border-2 border-highlight/20 text-sm font-semibold placeholder:text-muted focus:border-highlight outline-none"
        />

        @if (error()) {
          <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || submitting()" appButton class="w-full mt-1">
          {{ submitting() ? i18n.t('auth.loggingIn') : i18n.t('nav.login') }}
        </button>
      </form>

      <p class="text-xs text-center mt-4">
        <a routerLink="/forgot-password" class="text-highlight font-semibold">{{ i18n.t('auth.forgotPasswordLink') }}</a>
      </p>
    </div>
  </div>

  <p class="text-xs text-muted font-semibold mt-6">
    {{ i18n.t('auth.noAccount') }} <a routerLink="/register" class="text-highlight">{{ i18n.t('nav.register') }}</a>
  </p>
</div>
