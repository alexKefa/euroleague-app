<div class="min-h-[70vh] flex flex-col items-center justify-center px-6 py-10">
  <!-- The logo — "Pure Wordmark" (2026-09-12), see app.component.html's
       comment and CLAUDE.md's Branding section for the full rationale. -->
  <div class="mb-9">
    <svg role="img" aria-label="Clutch" width="192" height="64" viewBox="0 0 600 200">
      <g transform="translate(8 140) scale(0.15117 -0.15117)"><path transform="translate(0 0)" d="M733 405H522Q522 465 490.5 500.0Q459 535 401 535Q334 535 302.5 493.0Q271 451 271 376V312Q271 238 302.5 195.5Q334 153 399 153Q463 153 496.0 186.0Q529 219 529 279H733Q733 138 646.5 63.0Q560 -12 402 -12Q226 -12 135.5 78.0Q45 168 45 344Q45 520 135.5 610.0Q226 700 402 700Q555 700 644.0 623.5Q733 547 733 405Z" fill="var(--color-ink)"/><path transform="translate(768 0)" d="M67 0V725H266V0Z" fill="var(--color-ink)"/><path transform="translate(1091 0)" d="M443 0 430 80Q399 37 348.5 12.5Q298 -12 242 -12Q150 -12 104.0 39.0Q58 90 58 186V528H257V210Q257 176 274.5 155.5Q292 135 324 135Q361 135 384.0 159.0Q407 183 407 218V528H606V0Z" fill="var(--color-ink)"/><path transform="translate(1748 0)" d="M412 528V393H300V192Q300 156 312.0 139.5Q324 123 356 123H412V6Q388 -2 350.0 -7.0Q312 -12 284 -12Q196 -12 148.5 20.0Q101 52 101 129V393H27V528H109L152 688H300V528Z" fill="var(--color-ink)"/><path transform="translate(2182 0)" d="M624 315H431Q431 405 333 405Q235 405 235 292V235Q235 123 337 123Q439 123 439 215H624Q624 100 543.5 44.0Q463 -12 333 -12Q194 -12 115.0 58.0Q36 128 36 264Q36 400 115.0 470.0Q194 540 333 540Q463 540 543.5 484.5Q624 429 624 315Z" fill="var(--color-ink)"/><path transform="translate(2839 0)" d="M424 540Q516 540 562.0 489.0Q608 438 608 342V0H409V318Q409 352 391.5 372.5Q374 393 342 393Q305 393 282.0 369.0Q259 345 259 310V0H60V725H259V473Q291 505 334.0 522.5Q377 540 424 540Z" fill="var(--color-ink)"/></g>
      <path d="M 8 164 Q 273 176 538 164" fill="none" stroke="#FF6B35" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Glass capsule panel — same backdrop-blur/highlight-tint/highlight-border
       treatment as the mobile bottom nav's floating capsule (app.component.html),
       plus a diagonal holo-sweep shimmer echoing the collectible cards' tier
       gradient (features/store/collectible-card). Picked as "Direction C" from
       a 3-direction canvas comparison. -->
  <div class="relative w-full max-w-sm overflow-hidden rounded-[28px] bg-highlight/10 backdrop-blur-xl border border-highlight/25 shadow-pop px-6 py-8">
    <div
      class="pointer-events-none absolute inset-0"
      style="background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.14) 45%, rgba(124,108,240,0.18) 52%, transparent 65%)"
    ></div>

    <div class="relative">
      <h1 class="font-mono text-xs font-bold tracking-widest uppercase text-highlight mb-5">
        {{ i18n.t('nav.login') }}
      </h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
        <input
          type="email"
          formControlName="email"
          [placeholder]="i18n.t('auth.emailPlaceholder')"
          class="w-full px-4 py-3 rounded-2xl bg-page/40 border-2 border-highlight/20 text-sm font-semibold placeholder:text-muted focus:border-highlight outline-none"
        />
        <input
          type="password"
          formControlName="password"
          [placeholder]="i18n.t('auth.passwordPlaceholder')"
          class="w-full px-4 py-3 rounded-2xl bg-page/40 border-2 border-highlight/20 text-sm font-semibold placeholder:text-muted focus:border-highlight outline-none"
        />

        @if (error()) {
          <p class="text-red-500 text-xs font-semibold">{{ error() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || submitting()" appButton class="w-full mt-1">
          {{ submitting() ? i18n.t('auth.loggingIn') : i18n.t('nav.login') }}
        </button>
      </form>

      <p class="text-xs text-center mt-4">
        <a routerLink="/forgot-password" class="text-highlight font-semibold">{{ i18n.t('auth.forgotPasswordLink') }}</a>
      </p>
    </div>
  </div>

  <p class="text-xs text-muted font-semibold mt-6">
    {{ i18n.t('auth.noAccount') }} <a routerLink="/register" class="text-highlight">{{ i18n.t('nav.register') }}</a>
  </p>
</div>
